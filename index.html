<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓冲液反应动画演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        canvas { background-color: #f0fdf4; border-radius: 0 0 1rem 1rem; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden border border-gray-200">
        <!-- 顶部控制栏 -->
        <div class="bg-gray-50 p-6 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-2">酸性缓冲液工作原理 (Acidic Buffer)</h2>
            <p class="text-sm text-gray-600 mb-4">观察加入酸 (H⁺) 或碱 (OH⁻) 时，缓冲液内部粒子如何互相反应以维持平衡。</p>
            
            <div class="flex flex-wrap gap-3">
                <button id="btnAddAcid" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition active:scale-95 flex items-center">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    添加酸 (H⁺/H₃O⁺)
                </button>
                <button id="btnAddBase" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition active:scale-95 flex items-center">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    添加碱 (OH⁻)
                </button>
                <button id="btnReset" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg shadow transition active:scale-95 ml-auto">
                    重置缓冲液
                </button>
            </div>
        </div>

        <!-- 图例解释 -->
        <div class="flex flex-wrap justify-center gap-6 p-4 text-sm font-medium border-b border-gray-100">
            <div class="flex items-center"><span class="w-4 h-4 rounded-full bg-blue-500 mr-2 border border-blue-700"></span>弱酸 (CH₃COOH)</div>
            <div class="flex items-center"><span class="w-4 h-4 rounded-full bg-green-500 mr-2 border border-green-700"></span>共轭碱 (CH₃COO⁻)</div>
            <div class="flex items-center"><span class="w-4 h-4 rounded-full bg-red-500 mr-2 border border-red-700"></span>外加酸 (H⁺)</div>
            <div class="flex items-center"><span class="w-4 h-4 rounded-full bg-purple-500 mr-2 border border-purple-700"></span>外加碱 (OH⁻)</div>
        </div>

        <!-- 动画区域 -->
        <div class="relative w-full aspect-video flex justify-center bg-gray-50 p-6">
            <!-- 烧杯外观容器 -->
            <div class="relative w-full max-w-md h-full rounded-b-2xl border-4 border-t-0 border-gray-300 shadow-inner flex items-end justify-center bg-white">
                <!-- 液体背景 -->
                <div class="absolute bottom-0 w-full h-[85%] bg-blue-50/50 rounded-b-xl border-t border-blue-100"></div>
                <!-- 粒子画板 -->
                <canvas id="bufferCanvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>
            
            <!-- 状态提示框 -->
            <div id="statusOverlay" class="absolute top-8 left-1/2 transform -translate-x-1/2 bg-black/70 text-white px-4 py-2 rounded-full text-sm font-bold opacity-0 transition-opacity duration-300 pointer-events-none">
                反应发生！
            </div>
        </div>

        <!-- 数据统计 -->
        <div class="bg-gray-100 p-4 flex justify-around text-center border-t border-gray-200">
            <div>
                <div class="text-xs text-gray-500 uppercase font-bold">弱酸 (CH₃COOH)</div>
                <div id="countAcid" class="text-2xl font-black text-blue-600">10</div>
            </div>
            <div>
                <div class="text-xs text-gray-500 uppercase font-bold">共轭碱 (CH₃COO⁻)</div>
                <div id="countBase" class="text-2xl font-black text-green-600">10</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bufferCanvas');
        const ctx = canvas.getContext('2d');
        const countAcidEl = document.getElementById('countAcid');
        const countBaseEl = document.getElementById('countBase');
        const statusOverlay = document.getElementById('statusOverlay');

        // 设置画板尺寸
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let floatTexts = []; // 用于显示 "+ H2O"

        const TYPES = {
            WEAK_ACID: { color: '#3b82f6', borderColor: '#1d4ed8', label: 'CH3COOH', radius: 18 }, // 蓝
            CONJ_BASE: { color: '#10b981', borderColor: '#047857', label: 'CH3COO⁻', radius: 18 }, // 绿
            ADDED_ACID: { color: '#ef4444', borderColor: '#b91c1c', label: 'H⁺', radius: 12 },   // 红
            ADDED_BASE: { color: '#a855f7', borderColor: '#7e22ce', label: 'OH⁻', radius: 12 }    // 紫
        };

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.target = null;
                this.markedForDeletion = false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.type.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.type.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = this.type.borderColor;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 简单处理下标
                let label = this.type.label;
                if(label === 'CH3COOH') label = 'HA';
                if(label === 'CH3COO⁻') label = 'A⁻';
                ctx.fillText(label, this.x, this.y);
            }

            update() {
                // 边界碰撞反弹 (限制在液体区域，大约下方的 85%)
                const liquidTop = canvas.height * 0.15;
                
                if (this.x - this.type.radius < 0) { this.x = this.type.radius; this.vx *= -1; }
                if (this.x + this.type.radius > canvas.width) { this.x = canvas.width - this.type.radius; this.vx *= -1; }
                if (this.y - this.type.radius < liquidTop && !this.target) { this.y = liquidTop + this.type.radius; this.vy *= -1; }
                if (this.y + this.type.radius > canvas.height) { this.y = canvas.height - this.type.radius; this.vy *= -1; }

                // 追踪目标逻辑 (仅对外加酸碱生效)
                if (this.target && !this.target.markedForDeletion) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 5) {
                        this.vx = (dx / dist) * 3; // 追踪速度
                        this.vy = (dy / dist) * 3;
                    } else {
                        // 碰撞发生！发生反应
                        this.markedForDeletion = true;
                        this.target.markedForDeletion = true;
                        
                        // 产生新物质和漂浮的字
                        let newType = null;
                        if (this.type === TYPES.ADDED_ACID) newType = TYPES.WEAK_ACID;
                        else if (this.type === TYPES.ADDED_BASE) newType = TYPES.CONJ_BASE;

                        if (newType) {
                            particles.push(new Particle(this.target.x, this.target.y, newType));
                            floatTexts.push({ x: this.x, y: this.y, text: "+ H₂O", alpha: 1.0 });
                            updateCounts();
                        }
                    }
                }

                this.x += this.vx;
                this.y += this.vy;
            }
        }

        // 初始化缓冲液粒子
        function initBuffer() {
            particles = [];
            floatTexts = [];
            for (let i = 0; i < 10; i++) {
                spawnRandom(TYPES.WEAK_ACID);
                spawnRandom(TYPES.CONJ_BASE);
            }
            updateCounts();
            showStatus("缓冲液已就绪", false);
        }

        function spawnRandom(type) {
            const liquidTop = canvas.height * 0.15;
            const x = Math.random() * (canvas.width - type.radius * 2) + type.radius;
            const y = Math.random() * (canvas.height - liquidTop - type.radius * 2) + liquidTop + type.radius;
            particles.push(new Particle(x, y, type));
        }

        // 更新 UI 计数器
        function updateCounts() {
            const acidCount = particles.filter(p => p.type === TYPES.WEAK_ACID && !p.markedForDeletion).length;
            const baseCount = particles.filter(p => p.type === TYPES.CONJ_BASE && !p.markedForDeletion).length;
            countAcidEl.innerText = acidCount;
            countBaseEl.innerText = baseCount;
        }

        function showStatus(text, isAlert = true) {
            statusOverlay.innerText = text;
            statusOverlay.style.opacity = '1';
            statusOverlay.style.backgroundColor = isAlert ? 'rgba(220, 38, 38, 0.9)' : 'rgba(0, 0, 0, 0.7)';
            setTimeout(() => { statusOverlay.style.opacity = '0'; }, 2000);
        }

        // 添加强酸 (H+)
        document.getElementById('btnAddAcid').addEventListener('click', () => {
            // 寻找一个目标共轭碱
            const availableBases = particles.filter(p => p.type === TYPES.CONJ_BASE && !p.markedForDeletion);
            if (availableBases.length === 0) {
                showStatus("缓冲能力耗尽！pH 骤降！");
                return;
            }
            
            // 在顶部生成
            const newAcid = new Particle(canvas.width / 2, 20, TYPES.ADDED_ACID);
            // 随机锁定一个目标
            newAcid.target = availableBases[Math.floor(Math.random() * availableBases.length)];
            particles.push(newAcid);
            showStatus("加入H⁺！向左移动生成弱酸", false);
        });

        // 添加强碱 (OH-)
        document.getElementById('btnAddBase').addEventListener('click', () => {
            // 寻找一个目标弱酸
            const availableAcids = particles.filter(p => p.type === TYPES.WEAK_ACID && !p.markedForDeletion);
            if (availableAcids.length === 0) {
                showStatus("缓冲能力耗尽！pH 骤升！");
                return;
            }
            
            // 在顶部生成
            const newBase = new Particle(canvas.width / 2, 20, TYPES.ADDED_BASE);
            // 随机锁定一个目标
            newBase.target = availableAcids[Math.floor(Math.random() * availableAcids.length)];
            particles.push(newBase);
            showStatus("加入OH⁻！向右移动生成共轭碱", false);
        });

        document.getElementById('btnReset').addEventListener('click', initBuffer);

        // 主动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 更新和绘制粒子
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 移除被标记删除的粒子
            particles = particles.filter(p => !p.markedForDeletion);

            // 绘制漂浮的文本 (如 + H2O)
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let ft = floatTexts[i];
                ctx.fillStyle = `rgba(14, 165, 233, ${ft.alpha})`; // 天蓝色
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ft.y -= 1; // 向上漂浮
                ft.alpha -= 0.02; // 逐渐淡出
                if (ft.alpha <= 0) {
                    floatTexts.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // 启动
        setTimeout(() => {
            initBuffer();
            animate();
        }, 100); // 延迟一点等canvas尺寸确定
    </script>
</body>
</html>
