<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChemPilot Advance - Chemistry Airplane Chase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --gb-case: #d1d5db; --gb-bezel: #374151; --gb-btn: #ef4444; --gb-dpad: #1f2937; }
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #111827; touch-action: none; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .device-shell { background-color: var(--gb-case); width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 15px; position: relative; }
        .screen-wrapper { background-color: var(--gb-bezel); padding: 20px 20px 40px 20px; border-radius: 10px 10px 25px 10px; position: relative; flex-shrink: 0; box-shadow: inset 0 0 15px rgba(0,0,0,0.6); }
        .screen-area { background-color: #000; width: 100%; aspect-ratio: 1/1.2; position: relative; overflow: hidden; border: 4px solid #111; border-radius: 5px; }
        #game-canvas { width: 100%; height: 100%; display: block; }
        .dpad-container { width: 140px; height: 140px; position: relative; }
        .dpad-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; }
        .dpad-btn { background-color: var(--gb-dpad); position: absolute; cursor: pointer; box-shadow: 0 5px 0 #000; transition: all 0.1s; }
        .dpad-horizontal { width: 140px; height: 45px; top: 47.5px; left: 0; border-radius: 6px; }
        .dpad-vertical { width: 45px; height: 140px; top: 0; left: 47.5px; border-radius: 6px; }
        .touch-zone { position: absolute; z-index: 10; width: 60px; height: 60px; top: 40px; }
        .touch-left { left: 0; } .touch-right { right: 0; }
        .btn-a { width: 55px; height: 55px; background-color: var(--gb-btn); border-radius: 50%; box-shadow: 2px 5px 0 #991b1b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #991b1b; font-size: 18px; }
        .btn-a:active { transform: translateY(2px); box-shadow: 0 2px 0 #991b1b; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .interactive { pointer-events: auto; }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        .hero-plane-container { width: 100%; height: 120px; position: relative; margin-bottom: 20px; perspective: 1000px; }
        .hero-plane { width: 80px; height: 100px; margin: 0 auto; position: relative; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotateX(20deg); } 50% { transform: translateY(-15px) rotateX(15deg); } }
        .plane-wing-hero { position: absolute; top: 40px; left: -40px; width: 160px; height: 20px; background: linear-gradient(to bottom, #64748b, #475569); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
        .plane-body-hero { position: absolute; top: 0; left: 30px; width: 20px; height: 100px; background: linear-gradient(to right, #cbd5e1, #ffffff, #94a3b8); border-radius: 50% 50% 20% 20%; }
        .plane-cockpit-hero { position: absolute; top: 20px; left: 34px; width: 12px; height: 25px; background: #0ea5e9; border-radius: 50%; box-shadow: 0 0 10px #38bdf8; }
        @media (min-width: 851px) and (orientation: landscape) { .device-shell { background: transparent; width: 100%; max-width: 1100px; height: 100vh; justify-content: center; } .gb-decoration { display: none !important; } .screen-wrapper { background: transparent; height: 100%; box-shadow: none; padding: 0; } .screen-area { aspect-ratio: auto; height: 100%; border: none; } }
        .home-btn { background-color: transparent; border: 2px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 12px; transition: all 0.2s; margin-top: 10px; cursor: pointer; }
        .home-btn:hover { background: rgba(255,255,255,0.1); color: white; border-color: white; }
    </style>
</head>
<body>
    <div class="device-shell">
        <div class="screen-wrapper">
            <div class="screen-area" id="screen-container">
                <canvas id="game-canvas"></canvas>
                <div id="hud" class="ui-overlay pt-6 px-6 hidden">
                    <div class="flex justify-between w-full text-white pixel-font text-[10px] md:text-[14px]">
                        <div>SCORE:<span id="score-display" class="text-yellow-400">0</span></div>
                        <div id="lives-display">❤️❤️❤️</div>
                    </div>
                    <div class="mt-8 bg-slate-900/80 px-6 py-3 border-2 border-blue-400 rounded-xl text-center shadow-[0_0_20px_rgba(56,189,248,0.4)]">
                        <div id="target-name" class="text-white text-[18px] md:text-[28px] font-extrabold tracking-widest uppercase">Alcohol</div>
                    </div>
                </div>
                <div id="start-screen" class="ui-overlay justify-center bg-slate-950 z-50">
                    <div class="text-center text-white p-6 interactive w-full">
                        <div class="hero-plane-container"><div class="hero-plane"><div class="plane-wing-hero"></div><div class="plane-body-hero"></div><div class="plane-cockpit-hero"></div></div></div>
                        <h1 class="pixel-font text-2xl md:text-5xl mb-2 text-blue-400">CHEMPILOT</h1>
                        <h2 class="pixel-font text-xs md:text-lg mb-8 text-emerald-400 opacity-80">ADVANCE COLOR</h2>
                        <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-xl font-black text-lg md:text-2xl shadow-[0_6px_0_rgb(30,64,175)] active:translate-y-1 active:shadow-none">START MISSION</button>
                    </div>
                </div>
                <div id="game-over-screen" class="ui-overlay justify-center bg-red-950/95 z-50 hidden">
                    <div class="text-center text-white interactive p-8">
                        <h1 class="pixel-font text-4xl mb-4 text-red-500">CRASHED</h1>
                        <p class="text-xl mb-8">SCORE: <span id="final-score" class="font-bold">0</span></p>
                        <button id="restart-btn" class="w-full bg-white text-red-900 px-8 py-4 rounded-xl font-bold text-lg mb-4">RETRY</button>
                        <button class="home-btn w-full" onclick="showHome()">MAIN MENU</button>
                    </div>
                </div>
                <div id="success-screen" class="ui-overlay justify-center bg-emerald-950/95 z-50 hidden">
                    <div class="text-center text-white interactive p-8">
                        <h1 class="pixel-font text-3xl mb-4 text-emerald-400">MISSION CLEAR</h1>
                        <p class="text-xl mb-8">SCORE: <span id="success-score" class="font-bold">0</span></p>
                        <a href="https://docs.google.com/forms/d/e/1FAIpQLScBgtNpQNfJ2xU9m1grQWaiDRm9tX8rItr2KO4FzVUiFWiPnA/viewform?usp=publish-editor" target="_blank" class="block bg-blue-500 text-white font-bold py-5 px-8 rounded-xl mb-4 shadow-[0_6px_0_rgb(30,64,175)] text-lg">SUBMIT SCORE</a>
                        <button class="home-btn w-full" onclick="showHome()">MAIN MENU</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls-area gb-decoration flex justify-between items-center px-10 flex-grow">
            <div class="dpad-container"><div class="dpad-cross"><div class="dpad-btn dpad-horizontal"></div><div class="dpad-btn dpad-vertical"></div><div id="ctrl-left" class="touch-zone touch-left"></div><div id="ctrl-right" class="touch-zone touch-right"></div></div></div>
            <div id="ctrl-a" class="btn-a">A</div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d'), screenContainer = document.getElementById('screen-container');
        const chemistryData = [
            { name: "Alkene", formula: "-C=C-" }, { name: "Alkyne", formula: "-C≡C-" }, { name: "Alkyl Halide", formula: "-X" }, { name: "Alcohol", formula: "-OH" },
            { name: "Amine", formula: "-NH2" }, { name: "Ether", formula: "-O-" }, { name: "Carboxylic Acid", formula: "-COOH" }, { name: "Ketone", formula: "-CO-" },
            { name: "Aldehyde", formula: "-CHO" }, { name: "Ester", formula: "-COOR" }
        ];
        let gameState = 'START', score = 0, lives = 3, consecutiveCorrect = 0, bgStreaks = [], particles = [], clouds = [], currentTarget = null, animationId;
        const keys = { left: false, right: false };
        let player = { x: 0, y: 0, width: 50, height: 60, speed: 8 };

        function resizeCanvas() {
            canvas.width = screenContainer.clientWidth; canvas.height = screenContainer.clientHeight;
            player.width = Math.min(canvas.width * 0.14, 80); player.height = player.width * 1.2;
            player.speed = 8; // Fixed speed for better control
            player.y = canvas.height - player.height - 30;
            if (gameState === 'START') player.x = canvas.width / 2;
            bgStreaks = Array.from({length: 40}, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, length: 15 + Math.random() * 50, speed: 2 + Math.random() * 4 }));
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function createExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1, color, size: 2 + Math.random() * 3 });
        }

        function bindBtn(id, key) {
            const el = document.getElementById(id); if(!el) return;
            const start = (e) => { e.preventDefault(); keys[key] = true; };
            const end = (e) => { e.preventDefault(); keys[key] = false; };
            el.addEventListener('touchstart', start, {passive: false}); el.addEventListener('touchend', end, {passive: false});
            el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
        }
        bindBtn('ctrl-left', 'left'); bindBtn('ctrl-right', 'right');
        document.getElementById('ctrl-a').addEventListener('click', () => { if(gameState !== 'PLAYING') startGame(); });
        window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true; if (e.key === ' ' && gameState !== 'PLAYING') startGame(); });
        window.addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; });

        function showHome() { gameState = 'START'; cancelAnimationFrame(animationId); ['game-over-screen', 'success-screen', 'hud'].forEach(id => document.getElementById(id).classList.add('hidden')); document.getElementById('start-screen').classList.remove('hidden'); ctx.clearRect(0,0,canvas.width,canvas.height); }
        function startGame() { gameState = 'PLAYING'; score = 0; lives = 3; consecutiveCorrect = 0; particles = []; document.getElementById('score-display').innerText = score; document.getElementById('lives-display').innerText = '❤️'.repeat(lives); ['start-screen', 'game-over-screen', 'success-screen'].forEach(id => document.getElementById(id).classList.add('hidden')); document.getElementById('hud').classList.remove('hidden'); generateQuestion(); gameLoop(); }
        function generateQuestion() {
            clouds = []; currentTarget = chemistryData[Math.floor(Math.random() * chemistryData.length)];
            document.getElementById('target-name').innerText = currentTarget.name;
            let options = [currentTarget, ...chemistryData.filter(i => i.name !== currentTarget.name).sort(() => 0.5 - Math.random()).slice(0, 2)].sort(() => 0.5 - Math.random());
            options.forEach((opt, i) => clouds.push({ x: (canvas.width / 4) * (i + 1), y: -100 - Math.random() * 150, radius: Math.min(canvas.width * 0.13, 65), formula: opt.formula, isCorrect: opt.name === currentTarget.name, speed: (canvas.height * 0.004) + (consecutiveCorrect * 0.2) }));
        }

        function gameLoop() {
            if (gameState !== 'PLAYING' && gameState !== 'EXPLODING') return;
            ctx.fillStyle = '#020617'; ctx.fillRect(0,0,canvas.width,canvas.height);
            bgStreaks.forEach(s => { ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; s.y += s.speed + (consecutiveCorrect * 0.5); if (s.y > canvas.height) { s.y = -s.length; s.x = Math.random() * canvas.width; } ctx.fillRect(s.x, s.y, 2, s.length); });

            if (gameState === 'PLAYING') {
                if (keys.left) player.x -= player.speed; if (keys.right) player.x += player.speed;
                player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, player.x));
                clouds.forEach((c, i) => {
                    c.y += c.speed;
                    if (Math.sqrt((player.x - c.x)**2 + (player.y - c.y)**2) < c.radius + player.height/3) {
                        if (c.isCorrect) { score += 10; consecutiveCorrect++; document.getElementById('score-display').innerText = score; createExplosion(c.x, c.y, '#4ade80'); generateQuestion(); }
                        else { lives--; consecutiveCorrect = 0; document.getElementById('lives-display').innerText = '❤️'.repeat(lives); createExplosion(c.x, c.y, '#ef4444'); if (lives <= 0) { gameState = 'EXPLODING'; createExplosion(player.x, player.y, '#f97316', 50); setTimeout(endGame, 1000); } else generateQuestion(); }
                    } else if (c.y > canvas.height + c.radius) { if (c.isCorrect) { lives--; consecutiveCorrect = 0; document.getElementById('lives-display').innerText = '❤️'.repeat(lives); if (lives <= 0) { gameState = 'EXPLODING'; createExplosion(player.x, player.y, '#f97316', 50); setTimeout(endGame, 1000); } else generateQuestion(); } else clouds.splice(i, 1); }
                });
                clouds.forEach(c => { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#1e293b'; ctx.font = `bold ${Math.floor(c.radius*0.5)}px Inter`; ctx.textAlign='center'; ctx.fillText(c.formula, c.x, c.y+5); });
            }
            
            if (gameState !== 'EXPLODING') {
                ctx.save(); ctx.translate(player.x, player.y); const w = player.width/2, h = player.height;
                if (gameState === 'PLAYING') { ctx.fillStyle = Math.random() > 0.5 ? '#fbbf24' : '#ef4444'; ctx.beginPath(); ctx.moveTo(-w*0.3, h*0.8); ctx.lineTo(w*0.3, h*0.8); ctx.lineTo(0, h + Math.random() * 20); ctx.fill(); }
                ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w*1.8, h*0.6); ctx.lineTo(-w*1.8, h*0.6); ctx.fill();
                ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.moveTo(0, -h*0.3); ctx.quadraticCurveTo(w*0.5, h*0.2, w*0.4, h*0.9); ctx.lineTo(-w*0.4, h*0.9); ctx.quadraticCurveTo(-w*0.5, h*0.2, 0, -h*0.3); ctx.fill();
                ctx.fillStyle = '#0ea5e9'; ctx.beginPath(); ctx.ellipse(0, h*0.25, w*0.25, h*0.15, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
            }

            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; if (p.life <= 0) particles.splice(i, 1); else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; } });
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() { cancelAnimationFrame(animationId); document.getElementById('hud').classList.add('hidden'); if (score >= 70) { document.getElementById('success-screen').classList.remove('hidden'); document.getElementById('success-score').innerText = score; } else { document.getElementById('game-over-screen').classList.remove('hidden'); document.getElementById('final-score').innerText = score; } }
        document.getElementById('start-btn').addEventListener('click', startGame); document.getElementById('restart-btn').addEventListener('click', startGame);
        showHome();
    </script>
</body>
</html>
