<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasOn B2B App Demo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Custom animations */
        @keyframes progress {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
        .animate-progress {
          animation: progress 2s infinite linear;
        }
        .custom-scrollbar::-webkit-scrollbar {
          width: 0px;
          background: transparent;
        }
        @keyframes drive-in {
          0% { transform: translate(100px, 100px); opacity: 0; }
          100% { transform: translate(0, 0); opacity: 1; }
        }
        .animate-drive-in {
          animation: drive-in 1s ease-out forwards;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icon Components (Recreating Lucide Icons as SVG components for standalone HTML) ---
        const IconBase = ({ children, size = 24, className = "", ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Truck = (props) => <IconBase {...props}><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></IconBase>;
        const MapPin = (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Droplet = (props) => <IconBase {...props}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></IconBase>;
        const ShieldCheck = (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const Navigation = (props) => <IconBase {...props}><polygon points="3 11 22 2 13 21 11 13 3 11"/></IconBase>;
        const CheckCircle2 = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconBase>;
        const AlertTriangle = (props) => <IconBase {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 18 18"/></IconBase>;
        const Circle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/></IconBase>;


        // --- Main App Component ---
        function GasOnApp() {
            const [screen, setScreen] = useState('dashboard'); // dashboard, order, safety, tracking, success
            const [selectedTrucks, setSelectedTrucks] = useState([]);
            const [safetyStep, setSafetyStep] = useState(0);
            const [loading, setLoading] = useState(false);

            // Mock Data: JB Fleet
            const fleetData = [
                { id: 'JHU8821', type: 'Scania Heavy', fuel: 15, capacity: 300, location: 'Kempas Depot', status: 'Low' },
                { id: 'JQS1029', type: 'Volvo FMX', fuel: 45, capacity: 300, location: 'Kempas Depot', status: 'Good' },
                { id: 'JWA3312', type: 'Isuzu Giga', fuel: 10, capacity: 200, location: 'Pasir Gudang', status: 'Critical' },
            ];

            const FUEL_PRICE = 1.00; // Updated Price

            // Toggle Truck Selection
            const toggleTruck = (id) => {
                if (selectedTrucks.includes(id)) {
                setSelectedTrucks(selectedTrucks.filter(t => t !== id));
                } else {
                setSelectedTrucks([...selectedTrucks, id]);
                }
            };

            // Safety Check Simulation Logic
            useEffect(() => {
                if (screen === 'safety') {
                const timer1 = setTimeout(() => setSafetyStep(1), 1000);
                const timer2 = setTimeout(() => setSafetyStep(2), 2500);
                const timer3 = setTimeout(() => setSafetyStep(3), 4000);
                const timer4 = setTimeout(() => {
                    setLoading(false);
                }, 5000); 
                return () => {
                    clearTimeout(timer1);
                    clearTimeout(timer2);
                    clearTimeout(timer3);
                    clearTimeout(timer4);
                };
                } else {
                setSafetyStep(0); // Reset when leaving screen
                }
            }, [screen]);

            // Colors
            const colors = {
                primary: 'bg-teal-600',
                primaryDark: 'bg-slate-900',
                accent: 'text-teal-600',
                bg: 'bg-slate-50',
            };

            // --- Screens ---

            // 1. Dashboard
            const Dashboard = () => (
                <div className="space-y-6 pb-20">
                {/* Header */}
                <div className={`${colors.primaryDark} p-6 rounded-b-3xl shadow-lg text-white`}>
                    <div className="flex justify-between items-center mb-6">
                    <div>
                        <h1 className="text-2xl font-bold tracking-tight flex items-center gap-2">
                        GasOn <Droplet className="w-5 h-5 text-teal-400 fill-teal-400" />
                        </h1>
                        <p className="text-slate-400 text-sm">Johor Bahru Logistics Hub</p>
                    </div>
                    <div className="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center">
                        <User size={20} />
                    </div>
                    </div>
                    
                    <div className="flex justify-between gap-4">
                    <div className="bg-slate-800/50 p-4 rounded-xl flex-1 border border-slate-700">
                        <p className="text-xs text-slate-400 mb-1">Man-hours Saved</p>
                        <p className="text-2xl font-mono font-bold text-teal-400">124h</p>
                    </div>
                    <div className="bg-slate-800/50 p-4 rounded-xl flex-1 border border-slate-700">
                        <p className="text-xs text-slate-400 mb-1">Est. Fuel Cost</p>
                        <p className="text-2xl font-mono font-bold">RM {FUEL_PRICE.toFixed(2)}<span className="text-sm text-slate-500">/L</span></p>
                    </div>
                    </div>
                </div>

                {/* Fleet List */}
                <div className="px-6">
                    <div className="flex justify-between items-center mb-4">
                    <h2 className="text-lg font-bold text-slate-800">Fleet Status (Live)</h2>
                    <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full flex items-center gap-1">
                        <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Online
                    </span>
                    </div>

                    <div className="space-y-3">
                    {fleetData.map((truck) => (
                        <div 
                        key={truck.id}
                        onClick={() => toggleTruck(truck.id)}
                        className={`p-4 rounded-xl border-2 transition-all cursor-pointer relative overflow-hidden ${
                            selectedTrucks.includes(truck.id) 
                            ? 'border-teal-500 bg-teal-50 shadow-md' 
                            : 'border-white bg-white shadow-sm'
                        }`}
                        >
                        <div className="flex justify-between items-start">
                            <div className="flex items-center gap-3">
                            <div className={`p-2 rounded-lg ${truck.fuel < 20 ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-600'}`}>
                                <Truck size={24} />
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800">{truck.id}</h3>
                                <p className="text-xs text-slate-500">{truck.type} • {truck.location}</p>
                            </div>
                            </div>
                            <div className="text-right">
                            <p className={`font-bold ${truck.fuel < 20 ? 'text-red-500' : 'text-slate-700'}`}>
                                {truck.fuel}%
                            </p>
                            <p className="text-xs text-slate-400">{Math.round(truck.capacity * (truck.fuel/100))}L</p>
                            </div>
                        </div>
                        
                        {/* Progress Bar */}
                        <div className="mt-3 w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div 
                            className={`h-full rounded-full ${truck.fuel < 20 ? 'bg-red-500' : 'bg-teal-500'}`} 
                            style={{width: `${truck.fuel}%`}}
                            ></div>
                        </div>

                        {selectedTrucks.includes(truck.id) && (
                            <div className="absolute top-2 right-2 text-teal-600">
                            <CheckCircle2 size={20} className="text-teal-600" />
                            </div>
                        )}
                        </div>
                    ))}
                    </div>
                </div>

                {/* Floating Action Button */}
                {selectedTrucks.length > 0 && (
                    <div className="absolute bottom-0 left-0 w-full p-4 bg-white/80 backdrop-blur-md border-t border-slate-200 z-50 rounded-b-[40px]">
                    <button 
                        onClick={() => setScreen('order')}
                        className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-teal-200 flex items-center justify-center gap-2 transition-transform active:scale-95"
                    >
                        Request Refuel ({selectedTrucks.length}) <ChevronRight />
                    </button>
                    </div>
                )}
                </div>
            );

            // 2. Order Summary
            const OrderSummary = () => {
                const totalVolume = selectedTrucks.reduce((acc, id) => {
                const t = fleetData.find(x => x.id === id);
                return acc + (t.capacity - (t.capacity * (t.fuel/100)));
                }, 0);

                return (
                <div className="p-6 h-full flex flex-col bg-slate-50">
                    <div className="flex items-center gap-4 mb-8">
                    <button onClick={() => setScreen('dashboard')} className="p-2 bg-white rounded-full shadow-sm text-slate-600 hover:bg-slate-100">
                        <X size={20} />
                    </button>
                    <h2 className="text-xl font-bold text-slate-800">Confirm Order</h2>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm space-y-4 mb-6">
                    <div className="flex justify-between border-b border-slate-100 pb-4">
                        <span className="text-slate-500">Service Type</span>
                        <span className="font-bold text-slate-800 flex items-center gap-1">
                        <Clock size={16} className="text-teal-500" /> On-Demand
                        </span>
                    </div>
                    <div className="flex justify-between border-b border-slate-100 pb-4">
                        <span className="text-slate-500">Fuel Type</span>
                        <span className="font-bold text-slate-800">Euro 5 Diesel</span>
                    </div>
                    <div className="flex justify-between border-b border-slate-100 pb-4">
                        <span className="text-slate-500">Est. Volume</span>
                        <span className="font-bold text-teal-600">~{Math.round(totalVolume)} Liters</span>
                    </div>
                    <div className="flex justify-between">
                        <span className="text-slate-500">Est. Cost</span>
                        <span className="font-bold text-slate-800">RM {(totalVolume * FUEL_PRICE).toFixed(2)}</span>
                    </div>
                    </div>

                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl flex gap-3 items-start mb-auto">
                    <AlertTriangle className="text-amber-500 shrink-0" size={24} />
                    <div>
                        <h4 className="font-bold text-amber-800 text-sm">Safety Verification Required</h4>
                        <p className="text-xs text-amber-700 mt-1">Per BOMBA regulations, SafeTank protocol will initiate upon arrival. Please ensure engines are off.</p>
                    </div>
                    </div>

                    <button 
                    onClick={() => { setLoading(true); setScreen('safety'); }}
                    className="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-xl flex items-center justify-center gap-2 transition-transform active:scale-95"
                    >
                    <ShieldCheck className="text-teal-400" />
                    Initiate Safety Check
                    </button>
                </div>
                );
            };

            // 3. SafeTank Safety Check (Updated: Simple & Clear Style)
            const SafetyCheck = () => (
                <div className="h-full bg-white flex flex-col p-6">
                
                {/* Header */}
                <div className="mb-8 text-center mt-8">
                    <h2 className="text-2xl font-bold text-slate-900 mb-2">SafeTank™ Protocol</h2>
                    <p className="text-slate-500 text-sm">Mandatory Pre-Refuel Validation</p>
                </div>

                {/* Main Status Indicator */}
                <div className="flex justify-center mb-10">
                    <div className={`w-32 h-32 rounded-full border-4 flex flex-col items-center justify-center transition-all duration-500 ${
                    safetyStep >= 3 ? 'border-teal-500 bg-teal-50' : 'border-slate-200 bg-white'
                    }`}>
                    {safetyStep >= 3 ? (
                        <CheckCircle2 size={48} className="text-teal-600 mb-2" />
                    ) : (
                        <div className="w-12 h-12 border-4 border-slate-200 border-t-teal-600 rounded-full animate-spin mb-2"></div>
                    )}
                    <span className={`text-xs font-bold ${safetyStep >= 3 ? 'text-teal-700' : 'text-slate-400'}`}>
                        {safetyStep >= 3 ? 'PASSED' : 'CHECKING'}
                    </span>
                    </div>
                </div>

                {/* Checklist - Clean & Flat */}
                <div className="space-y-4 flex-1">
                    <SafetyItemSimple 
                    label="DOSH Permit Verification" 
                    active={true} 
                    done={safetyStep >= 1} 
                    />
                    <SafetyItemSimple 
                    label="Static Grounding Connected" 
                    active={safetyStep >= 1} 
                    done={safetyStep >= 2} 
                    />
                    <SafetyItemSimple 
                    label="Auto-Shutoff Valve Test" 
                    active={safetyStep >= 2} 
                    done={safetyStep >= 3} 
                    />
                </div>

                {/* Footer Button */}
                <div className="mt-8">
                    <button 
                    onClick={() => setScreen('tracking')}
                    disabled={safetyStep < 3}
                    className={`w-full font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all ${
                        safetyStep >= 3 
                        ? 'bg-teal-600 text-white shadow-lg hover:bg-teal-700 cursor-pointer' 
                        : 'bg-slate-100 text-slate-300 cursor-not-allowed'
                    }`}
                    >
                    {safetyStep >= 3 ? 'Dispatch Truck' : 'Processing...'}
                    {safetyStep >= 3 && <ChevronRight size={20} />}
                    </button>
                </div>
                </div>
            );

            const SafetyItemSimple = ({ label, active, done }) => (
                <div className={`flex items-center justify-between p-4 rounded-lg border transition-all duration-300 ${
                done 
                    ? 'border-teal-500 bg-teal-50' 
                    : active 
                    ? 'border-slate-300 bg-white' 
                    : 'border-slate-100 bg-slate-50 opacity-50'
                }`}>
                <div className="flex items-center gap-3">
                    {done ? (
                    <CheckCircle2 size={20} className="text-teal-600" />
                    ) : active ? (
                    <div className="w-5 h-5 rounded-full border-2 border-slate-300 border-t-slate-600 animate-spin"></div>
                    ) : (
                    <Circle size={20} className="text-slate-300" />
                    )}
                    <span className={`font-medium ${done ? 'text-teal-900' : 'text-slate-700'}`}>
                    {label}
                    </span>
                </div>
                </div>
            );

            // 4. Tracking
            const Tracking = () => (
                <div className="h-full flex flex-col relative bg-slate-100">
                {/* Map Background */}
                <div className="flex-1 bg-slate-200 relative overflow-hidden flex items-center justify-center">
                    {/* Grid Lines */}
                    <div className="absolute inset-0 grid grid-cols-6 grid-rows-6 gap-0 opacity-10 pointer-events-none">
                    {[...Array(36)].map((_, i) => <div key={i} className="border border-slate-400"></div>)}
                    </div>
                    
                    {/* Route Path */}
                    <svg className="absolute w-full h-full pointer-events-none" style={{zIndex: 1}}>
                    <path d="M 100 100 Q 200 150 250 300 T 350 500" fill="none" stroke="#0d9488" strokeWidth="4" strokeDasharray="8 4" className="animate-dash" />
                    </svg>

                    {/* Destination Marker */}
                    <div className="absolute top-[20%] left-[20%] z-10">
                    <div className="relative">
                        <div className="absolute -inset-4 bg-teal-500/20 rounded-full animate-ping"></div>
                        <div className="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center shadow-lg text-white border-2 border-white">
                            <MapPin size={20} />
                        </div>
                        <div className="absolute top-12 left-1/2 -translate-x-1/2 bg-white px-2 py-1 rounded shadow text-xs font-bold whitespace-nowrap text-slate-700">Your Fleet</div>
                    </div>
                    </div>

                    {/* Truck Marker (Animated) */}
                    <div className="absolute z-20 animate-drive-in" style={{top: '60%', left: '70%'}}>
                    <div className="relative">
                        <div className="w-12 h-12 bg-teal-600 rounded-full flex items-center justify-center shadow-xl text-white border-2 border-white transform -rotate-12">
                            <Truck size={24} />
                        </div>
                        <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-3 py-1 rounded-lg shadow text-xs font-bold whitespace-nowrap">
                        GasOn Unit 05
                        </div>
                    </div>
                    </div>
                </div>

                {/* Driver Card */}
                <div className="bg-white rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.1)] p-6 z-30">
                    <div className="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-6"></div>
                    
                    <div className="flex justify-between items-start mb-6">
                    <div>
                        <h3 className="text-xl font-bold text-slate-800">En Route</h3>
                        <p className="text-teal-600 font-medium">ETA: 12 Mins</p>
                    </div>
                    <div className="text-right">
                        <span className="inline-block px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-lg mb-1">DOSH Certified</span>
                        <p className="text-xs text-slate-400">Order #GO-9921</p>
                    </div>
                    </div>

                    <div className="flex items-center gap-4 border-t border-slate-100 pt-6">
                    <div className="w-12 h-12 bg-slate-200 rounded-full overflow-hidden">
                        <User size={48} className="text-slate-400 p-2" />
                    </div>
                    <div className="flex-1">
                        <h4 className="font-bold text-slate-800">Azman bin Ali</h4>
                        <p className="text-xs text-slate-500">Senior Safety Driver (4.9⭐)</p>
                    </div>
                    <button className="p-3 bg-teal-50 text-teal-600 rounded-full">
                        <Navigation size={20} />
                    </button>
                    </div>

                    <button 
                    onClick={() => setScreen('dashboard')} 
                    className="mt-6 w-full border border-slate-200 text-slate-500 py-3 rounded-xl text-sm font-medium hover:bg-slate-50"
                    >
                    Cancel Order
                    </button>
                </div>
                </div>
            );

            return (
                <div className="w-[390px] h-[844px] mx-auto bg-slate-50 relative overflow-hidden shadow-2xl rounded-[50px] border-[14px] border-slate-900 font-sans no-scrollbar box-content">
                {/* Status Bar */}
                <div className="h-8 bg-slate-900 w-full flex justify-between items-center px-6 text-white text-xs z-50 relative">
                    <span>10:42 AM</span>
                    <div className="flex gap-2">
                    <span>5G</span>
                    <span>100%</span>
                    </div>
                </div>

                {/* Main Content */}
                <div className="h-[calc(100%-32px)] overflow-y-auto no-scrollbar">
                    {screen === 'dashboard' && <Dashboard />}
                    {screen === 'order' && <OrderSummary />}
                    {screen === 'safety' && <SafetyCheck />}
                    {screen === 'tracking' && <Tracking />}
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GasOnApp />);
    </script>
</body>
</html>
